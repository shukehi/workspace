<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购工作台 v1.6 | Procurement Workbench</title>
    <meta name="description" content="统一采购工作台 - 快速生成包装、锁芯等采购订单">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/main.css?v=1.6">
    <link rel="stylesheet" href="css/pages/workbench.css?v=1.6">
    <link rel="stylesheet" href="css/pages/workbench-modal.css?v=1.6">
    <!-- Vue 3 (Global Build) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 导入导航组件 -->
    <script type="module" src="js/components/AppNavigation.js"></script>
</head>

<body>
    <div class="workbench-wrapper">
        <!-- ==================== 顶部导航栏 ==================== -->
        <app-navigation></app-navigation>

        <!-- ==================== 工作台主体 ==================== -->
        <div class="workbench-layout">

            <!-- ========== 左侧：命令输入区 (Command Panel) ========== -->
            <aside class="workbench-sidebar">
                <div class="sidebar-section">
                    <div class="section-label">LOAD SOURCE</div>
                    <div class="command-input-group">
                        <input type="text" id="orderCodeInput" placeholder="输入合同编号..." autocomplete="off">
                        <button id="searchBtn" class="cmd-btn">
                            <span class="btn-text">FETCH</span>
                            <span class="btn-loader"></span>
                        </button>
                    </div>
                    <p id="errorMsg" class="error-message"></p>
                    <div class="mode-toggle">
                        <label class="toggle-label">
                            <input type="checkbox" id="appendModeToggle">
                            <span class="toggle-text">APPEND MODE</span>
                        </label>
                    </div>
                </div>

                <!-- 订单元数据（精简展示） -->
                <div class="sidebar-section" id="orderMetaSection">
                    <div class="section-label">ORDER META</div>
                    <div class="meta-grid" id="orderMetaGrid">
                        <div class="meta-item">
                            <span class="meta-key">CLIENT</span>
                            <span class="meta-value" id="customerName">--</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-key">CODE</span>
                            <span class="meta-value mono" id="orderCode">--</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-key">DATE</span>
                            <span class="meta-value mono" id="orderDate">--</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-key">DUE</span>
                            <span class="meta-value mono" id="advanceDate">--</span>
                        </div>
                    </div>
                </div>

                <!-- 已加载订单列表 -->
                <div class="sidebar-section" id="loadedSourcesSection">
                    <div class="section-label">LOADED SOURCES</div>
                    <div class="sources-list" id="sourcesList">
                        <div class="sources-list-empty">暂无已加载订单</div>
                    </div>
                </div>

                <!-- 备注/异常提醒区 -->
                <div class="sidebar-section" id="remarksSection">
                    <div class="section-label">REMARKS / ALERTS</div>
                    <div class="remarks-box" id="orderRemark">
                        <span class="placeholder-text">无备注信息</span>
                    </div>
                    <!-- 智能提取的异常项 -->
                    <div id="alertsContainer" class="alerts-container hidden">
                        <!-- 动态注入识别出的异常需求 -->
                    </div>
                </div>

                <!-- 状态指示器 -->
                <div class="sidebar-section">
                    <div class="section-label">STATUS</div>
                    <div class="status-indicator" id="workbenchStatus">
                        <span class="status-dot idle"></span>
                        <span class="status-text">IDLE</span>
                    </div>
                </div>
            </aside>

            <!-- ========== 中央：采购处理中心 (The Hub) ========== -->
            <main class="workbench-main" id="app">
                <!-- Vue App will mount here -->
                <workbench-app></workbench-app>
            </main>

            <!-- ==================== Vue Templates ==================== -->

            <!-- 1. Workbench App Root Template -->
            <script type="text/x-template" id="workbench-app-template">
                <div>
                    <!-- Hub Tabs Navigation -->
                    <nav class="hub-tabs" id="hubTabs">
                        <button 
                            v-for="tab in tabs" 
                            :key="tab.id"
                            class="hub-tab" 
                            :class="{ active: currentTab === tab.id }"
                            @click="currentTab = tab.id">
                            <span class="tab-label">{{ tab.label }}</span>
                            <span class="tab-desc">{{ tab.desc }}</span>
                        </button>
                    </nav>

                    <!-- Hub Content Area -->
                    <div class="hub-content">
                        <!-- Using KeepAlive to preserve state between tab switches -->
                        <keep-alive>
                            <component :is="currentTabComponent"
                                :orders="purchaseOrders"
                                @generate="generateOrders"
                                @delete-po="deletePO"
                                @clear-all="clearAllPOs"
                            ></component>
                        </keep-alive>
                    </div>
                </div>
            </script>

            <!-- 2. Source Tab Template -->
            <script type="text/x-template" id="source-tab-template">
                <div class="hub-panel active">
                    <div class="panel-header">
                        <h2>订单原始数据 <span class="badge">{{ items.length }} items</span></h2>
                        <div class="panel-actions">
                            <button @click="generateOrders" class="action-btn primary">
                                生成采购订单 ▼
                            </button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="details-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>产品名称</th>
                                    <th>规格</th>
                                    <th>颜色</th>
                                    <th>L</th>
                                    <th>R</th>
                                    <th>门板款式</th>
                                    <th>锁具</th>
                                    <th>详情</th>
                                    <th>来源订单</th>
                                    <th style="width: 50px; text-align: center;">统计</th>
                                    <th style="width: 80px; text-align: center;">合并</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="(item, index) in items" :key="index">
                                    <td>{{ index + 1 }}</td>
                                    <td>{{ item.productName }}</td>
                                    <td>{{ item.spec }}</td>
                                    <td>{{ item.color }}</td>
                                    <td>{{ item.qtyL }}</td>
                                    <td>{{ item.qtyR }}</td>
                                    <td>{{ item.doorType }}</td>
                                    <td>{{ item.lockType }}</td>
                                    <td>{{ item.details }}</td>
                                    <td>{{ item.sourceOrder }}</td>
                                    <td class="text-center">
                                        <input type="checkbox" v-model="item.includeStats">
                                    </td>
                                    <td class="text-center">
                                        <input type="checkbox" v-model="item.merge">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div v-if="items.length === 0" class="empty-state">
                        <p>请在左侧输入合同编号并点击 FETCH</p>
                    </div>
                </div>
            </script>

            <!-- 3. Stats Tab Template -->
            <script type="text/x-template" id="stats-tab-template">
                <div class="hub-panel active">
                    <div class="panel-header">
                        <h2>配件颜色统计 <span class="badge">{{ uniqueColors }} 种颜色</span></h2>
                    </div>

                    <!-- Key Metrics Cards -->
                    <div class="stats-cards">
                        <div class="stat-card">
                            <span class="stat-label">UNIQUE COLORS</span>
                            <span class="stat-value">{{ uniqueColors }}</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">TOTAL DOORS</span>
                            <span class="stat-value">{{ totalDoors }}</span>
                        </div>
                    </div>

                    <!-- Color Distribution Table -->
                    <div class="table-responsive">
                        <table class="stats-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>颜色名称</th>
                                    <th>门数量</th>
                                    <th>占比</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="(stat, index) in statistics" :key="stat.color">
                                    <td>{{ index + 1 }}</td>
                                    <td>{{ stat.color }}</td>
                                    <td>{{ stat.count }}</td>
                                    <td>{{ stat.percentage }}%</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div v-if="statistics.length === 0" class="empty-state">
                        <p>请先加载订单数据</p>
                    </div>
                </div>
            </script>

            <!-- 4. Materials Tab Template (Placeholder / Future) -->
            <script type="text/x-template" id="materials-tab-template">
                <div class="hub-panel active">
                    <div class="panel-header">
                        <h2>原材料采购清单</h2>
                    </div>
                    <div class="empty-state" style="display: flex;">
                        <p>Materials Tab (In Progress)</p>
                    </div>
                </div>
            </script>

            <!-- 5. Orders Tab Template -->
            <script type="text/x-template" id="orders-tab-template">
                <div class="hub-panel active">
                    <div class="panel-header">
                        <h2>采购单管理 <span class="badge" id="po-count">{{ orders.length }}</span></h2>
                        <div class="panel-actions">
                            <button class="action-btn danger" @click="clearAll">清空全部</button>
                            <button class="action-btn secondary" @click="exportAll">导出全部</button>
                            <label class="action-btn secondary" style="cursor: pointer;">
                                导入
                                <input type="file" hidden @change="handleImport">
                            </label>
                        </div>
                    </div>

                    <div class="po-grid-container">
                        <div v-for="po in orders" :key="po.id" class="po-card">
                            <div class="po-header">
                                <span class="po-number">{{ po.poNumber }}</span>
                                <span class="po-status" :class="po.status">{{ po.status }}</span>
                            </div>
                            <div class="po-body">
                                <p><strong>供应商:</strong> {{ po.supplier }}</p>
                                <p><strong>类型:</strong> {{ po.category }}</p>
                                <p><strong>包含订单:</strong> <span class="mono">{{ po.sourceOrders }}</span></p>
                                <p><strong>生成时间:</strong> {{ formatDate(po.generatedAt) }}</p>
                            </div>
                            <div class="po-footer">
                                <button class="btn-text" @click="viewPO(po)">查看</button>
                                <button class="btn-text" @click="printPO(po)">打印</button>
                                <button class="btn-text danger" @click="deletePO(po.id)">删除</button>
                            </div>
                        </div>
                    </div>

                    <div v-if="orders.length === 0" class="empty-state" style="display: flex;">
                        <p>暂无生成的采购单</p>
                        <span>请在 SOURCE 页面选择项目生成</span>
                    </div>
                </div>
            </script>
        </div>

        <!-- ==================== 底部固定操作栏 ==================== -->
        <footer class="workbench-footer">
            <div class="footer-left">
                <span class="footer-label">WORKBENCH v1.0</span>
                <span class="footer-divider">|</span>
                <span class="footer-status" id="footerStatus">Ready</span>
            </div>
            <div class="footer-right">
                <button id="resetWorkbenchBtn" class="footer-btn">RESET</button>
                <button id="quickExportBtn" class="footer-btn primary" disabled>QUICK EXPORT</button>
            </div>
        </footer>

        <!-- ==================== 类别选择 Modal ==================== -->
        <div id="categoryModal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3>选择要生成的采购单类别</h3>
                    <button class="modal-close" id="modalCloseBtn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="category-grid">
                        <label class="category-item">
                            <input type="checkbox" name="category" value="packaging" checked>
                            <span class="category-label">包装</span>
                        </label>
                        <label class="category-item">
                            <input type="checkbox" name="category" value="cylinder">
                            <span class="category-label">锁芯</span>
                        </label>
                        <label class="category-item">
                            <input type="checkbox" name="category" value="hardware">
                            <span class="category-label">五金</span>
                        </label>
                        <label class="category-item">
                            <input type="checkbox" name="category" value="lock">
                            <span class="category-label">锁叉</span>
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="selectAllBtn" class="btn-secondary">全选</button>
                    <button id="confirmGenerateBtn" class="btn-primary">生成</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Print-only elements (Hidden normally) -->
    <div class="print-header hidden">
        <h1>包装采购订单</h1>
        <div class="print-meta">
            <span>供应商: <b id="printSupplier">美+C单</b></span>
            <span>日期: <span id="printDate"></span></span>
            <span>单号: <span id="printCode"></span></span>
        </div>
    </div>
    <div class="print-footer hidden">
        <div class="sign-box">
            <span>制单人:</span>
            <div class="line"></div>
        </div>
        <div class="sign-box">
            <span>审核人:</span>
            <div class="line"></div>
        </div>
        <div class="sign-box">
            <span>供应商签字:</span>
            <div class="line"></div>
        </div>
    </div>

    <script type="module" src="js/pages/workbench.js?v=1.6"></script>
</body>

</html>

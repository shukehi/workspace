name: CSS Governance

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  css-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint CSS
        run: npm run lint:css

      - name: Print style guard
        run: node --test tests/print-style-guard.test.js
